[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name on PyPI ("moose" is taken); the package is imported as `moose`.
name = "moose-annotate"
version = "0.1.0"
description = "Privacy annotation of text and tables with the W3C Data Privacy Vocabulary (DPV): LLMs find, a local System 1 model gives the probabilities"
readme = "docs/library.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  {name = "SINTEF"}
]
keywords = ["dpv", "privacy", "gdpr", "ner", "annotation", "llm", "table annotation", "data privacy vocabulary"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
# The library: annotate on your own machine with your own LLM key.
dependencies = [
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.1",
  "httpx>=0.27.0",
  "ollama>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/DATAPACT/moose"
Source = "https://github.com/DATAPACT/moose"
Issues = "https://github.com/DATAPACT/moose/issues"

[project.optional-dependencies]
# The REST API server (moose_api), as in the Docker image.
api = [
  "fastapi>=0.111.0",
  "uvicorn>=0.29.0",
  "motor>=3.3.0",
  "cryptography>=42.0.0",
  "pyjwt>=2.8.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]
# Local "System 1" linker for two-step annotation (moose.linkers); pulls in PyTorch.
laya = [
  "laya>=0.4.13",
  "protobuf",
  "sentencepiece",
]
demo = [
  "streamlit>=1.50.0",
  "Authlib>=1.3.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
moose_api = ["static/*"]
moose = [
  "data/**/*.json",
  "data/**/*.jsonld",
  "data/**/*.txt"
]

# DPV's source files (40 MB) are only for rebuilding the concept files (scripts/), and
# user schemas and backups belong to each installation.
[tool.setuptools.exclude-package-data]
moose = ["data/dpv/raw/**", "data/user/**", "data/user_vocabularies.json", "data/*.bak"]

[tool.pytest.ini_options]
addopts = "-q"
