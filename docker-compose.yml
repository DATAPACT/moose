# One Compose file for local use and production. Start it with ./scripts/deploy.sh,
# which prepares the bind mounts and the proxy network first.
name: moose

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  moose-api:
    build:
      context: .
      args:
        # "laya" installs the local Laya linker for two-step schemas.
        MOOSE_EXTRAS: ${MOOSE_EXTRAS:-}
    ports:
      - "${MOOSE_BIND_ADDRESS:-127.0.0.1}:${MOOSE_API_PORT:-8000}:8000"
    env_file:
      - ${MOOSE_ENV_FILE:-.env}
    environment:
      MOOSE_API_PORT: "8000"
      MOOSE_MONGO_URL: mongodb://mongo:27017
    command:
      - uvicorn
      - moose_api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      # Always one process: users' jobs run in the process that accepted them, with their
      # vault key in its memory, and a process that starts fails the users' jobs it finds
      # unfinished. A second process would fail the first one's running jobs.
      - --workers
      - "1"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    volumes:
      # User-ingested schemas survive rebuilds.
      - ./data/moose-user:/app/src/moose/data/user
      # Downloaded models (Laya), so a rebuild does not fetch them again.
      - moose-models:/root/.cache/huggingface
      - type: bind
        source: ./data/user_vocabularies.json
        target: /app/src/moose/data/user_vocabularies.json
        bind:
          create_host_path: false
    networks:
      - default
      - proxy
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os,urllib.request;
          req=urllib.request.Request('http://localhost:8000/health',
          headers={'X-API-Key': os.environ.get('MOOSE_API_KEY','')});
          urllib.request.urlopen(req, timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  mongo:
    image: mongo:7
    volumes:
      # A host folder by default (the VM's existing data). On macOS set
      # MOOSE_MONGO_VOLUME=moose-mongo: Docker Desktop files under ~/Desktop or
      # ~/Documents get macOS protection tags that stop MongoDB opening them.
      - ${MOOSE_MONGO_VOLUME:-./data/mongo}:/data/db
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  moose-demo:
    build:
      context: .
      dockerfile: Dockerfile.demo
    ports:
      - "${MOOSE_BIND_ADDRESS:-127.0.0.1}:${MOOSE_DEMO_PORT:-8501}:8501"
    environment:
      MOOSE_API_BASE_URL: http://moose-api:8000
      # Login: MOOSE_AUTH_ENABLED=false turns it off (local development only).
      MOOSE_AUTH_ENABLED: ${MOOSE_AUTH_ENABLED:-true}
      MOOSE_DASHBOARD_URL: ${MOOSE_DASHBOARD_URL:-}
      MOOSE_DASHBOARD_OIDC_METADATA_URL: ${MOOSE_DASHBOARD_OIDC_METADATA_URL:-}
      MOOSE_DASHBOARD_OIDC_CLIENT_ID: ${MOOSE_DASHBOARD_OIDC_CLIENT_ID:-}
      MOOSE_DASHBOARD_OIDC_CLIENT_SECRET: ${MOOSE_DASHBOARD_OIDC_CLIENT_SECRET:-}
      MOOSE_DASHBOARD_COOKIE_SECRET: ${MOOSE_DASHBOARD_COOKIE_SECRET:-}
    networks:
      - default
      - proxy
    depends_on:
      moose-api:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

volumes:
  moose-mongo:
  moose-models:

networks:
  # Shared with the reverse proxy or tunnel (cloudflare_default on the VM).
  # The databases never join it.
  proxy:
    name: ${MOOSE_PROXY_NETWORK:-moose-proxy}
    external: true
