# LiteLLM gateway for Moose.
#
# Provider keys (OpenRouter, Ollama) and model aliases are added in the admin UI and
# stored encrypted in Postgres with LITELLM_SALT_KEY. Nothing secret belongs in this file.
# Admins log in to the UI with LITELLM_UI_USERNAME / LITELLM_UI_PASSWORD from the env file.

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

litellm_settings:
  # Moose sends sensitive data through the gateway: never log prompts or completions.
  turn_off_message_logging: true
